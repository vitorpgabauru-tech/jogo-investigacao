<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Arquivo do Caso</title>
</head>
<body>
  <h1>Caso 1968-01 — Operação Falcão</h1>

  <h2>Suspeitos</h2>
  <ul id="lista-suspeitos"></ul>

  <h2>Testemunhas</h2>
  <ul id="lista-testemunhas"></ul>

  <h2>Evidências</h2>
  <p id="contador"></p>
  <button onclick="investigar()">Investigar</button>
  <ul id="lista-evidencias"></ul>

  <h2>Sua hipótese</h2>
  <select id="select-acusado"></select>
  <button onclick="acusar()">Confirmar Acusação</button>
  <p id="resultado-acusacao"></p>

  <script src="caso.js"></script>
  <script>
    const listaSuspeitos = document.getElementById("lista-suspeitos");
    for (const suspeito of suspeitos) {
      const item = document.createElement("li");
      item.textContent = suspeito.nome + " — " + suspeito.motivo;
      listaSuspeitos.appendChild(item);
    }

    const listaTestemunhas = document.getElementById("lista-testemunhas");
    for (const testemunha of testemunhas) {
      const item = document.createElement("li");
      item.textContent = testemunha.nome + " — " + testemunha.relato;
      listaTestemunhas.appendChild(item);
    }

    function renderizarEvidencias() {
      const listaEvidencias = document.getElementById("lista-evidencias");
      listaEvidencias.innerHTML = "";

      for (const evidencia of evidencias) {
        if (evidencia.descoberta) {
          const item = document.createElement("li");
          item.textContent = "[" + evidencia.tipo + "] " + evidencia.descricao + " — " + evidencia.forca;
          listaEvidencias.appendChild(item);
        }
      }

      let descobertas = 0;
      for (const evidencia of evidencias) {
        if (evidencia.descoberta) {
          descobertas = descobertas + 1;
        }
      }
      document.getElementById("contador").textContent = descobertas + " de " + evidencias.length + " evidências descobertas";
    }

    function investigar() {
      for (const evidencia of evidencias) {
        if (!evidencia.descoberta) {
          evidencia.descoberta = true;
          break;
        }
      }
      renderizarEvidencias();
    }

    const selectAcusado = document.getElementById("select-acusado");
    for (const suspeito of suspeitos) {
      const opcao = document.createElement("option");
      opcao.value = suspeito.nome;
      opcao.textContent = suspeito.nome;
      selectAcusado.appendChild(opcao);
    }

    function acusar() {
      const nomeEscolhido = document.getElementById("select-acusado").value;
      const resultadoDiv = document.getElementById("resultado-acusacao");

      if (nomeEscolhido === verdade.culpado) {
        resultadoDiv.textContent = "FINAL B — PARCIAL: Você identificou Ricardo Meireles como o assassino de Henrique Lacerda. A motivação era pessoal — um caso extraconjugal e um desvio de dinheiro — não política. Mas o encobrimento feito pela Operação Falcão nunca foi provado.";
      } else if (nomeEscolhido === "Délcio Ramos") {
        resultadoDiv.textContent = "FINAL D — ERRO: Você acusou Délcio Ramos, um estudante que apenas passou pelo apartamento para buscar panfletos. O verdadeiro assassino permanece livre.";
      } else {
        resultadoDiv.textContent = "FINAL G — SEM SOLUÇÃO: as evidências reunidas não sustentam essa acusação. O caso permanece oficialmente sem solução.";
      }
    }

    renderizarEvidencias();
  </script>
</body>
</html>
