<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Arquivo do Caso</title>
</head>
<body>

  <div id="tela-abertura">
    <h1>Caso 1968-01 — Operação Falcão</h1>
    <div id="briefing"></div>
    <button onclick="iniciarInvestigacao()">Começar investigação</button>
  </div>

  <div id="tela-investigacao" style="display: none;">
    <h2>Suspeitos</h2>
    <ul id="lista-suspeitos"></ul>

    <h2>Investigação</h2>
    <p id="contador"></p>

    <h3>Pistas disponíveis</h3>
    <ul id="lista-disponiveis"></ul>

    <h3>Pistas descobertas</h3>
    <ul id="lista-descobertas"></ul>

    <h2>Sua hipótese</h2>
    <select id="select-acusado"></select>
    <button onclick="acusar()">Confirmar Acusação</button>
  </div>

  <div id="tela-resultado" style="display: none;">
    <h2>Resultado</h2>
    <p id="resultado-final"></p>
  </div>

  <script src="caso.js"></script>
  <script>
    const briefingDiv = document.getElementById("briefing");
    briefingDiv.innerHTML = "<h2>" + briefing.titulo + "</h2>" +
      "<p><strong>Vítima:</strong> " + briefing.vitima + "</p>" +
      "<p><strong>Local:</strong> " + briefing.local + "</p>" +
      "<p><strong>Data:</strong> " + briefing.data + "</p>" +
      "<p>" + briefing.texto + "</p>";

    function iniciarInvestigacao() {
      document.getElementById("tela-abertura").style.display = "none";
      document.getElementById("tela-investigacao").style.display = "block";
    }

    const opcoesStatus = ["Não decidido", "Suspeito", "Não suspeito"];

    for (const suspeito of suspeitos) {
      suspeito.status = "Não decidido";
    }

    function motivoVisivel(suspeito) {
      if (suspeito.revelaMotivoPista === null) {
        return true;
      }
      const pista = pistas.find(function (p) { return p.id === suspeito.revelaMotivoPista; });
      return pista ? pista.descoberta : false;
    }

    function pistaDisponivel(pista) {
      if (pista.descoberta) {
        return false;
      }
      return pista.requer.every(function (idRequerido) {
        const requerida = pistas.find(function (p) { return p.id === idRequerido; });
        return requerida && requerida.descoberta;
      });
    }

    function calcularDisponiveisAtuais() {
      return pistas.filter(pistaDisponivel).map(function (p) { return p.id; });
    }

    function calcularMotivosVisiveisAtuais() {
      return suspeitos.filter(motivoVisivel).map(function (s) { return s.nome; });
    }

    let pistasConhecidas = calcularDisponiveisAtuais();
    let pistasNaoVistas = [];
    let suspeitosConhecidos = calcularMotivosVisiveisAtuais();
    let suspeitosNaoVistos = [];

    function atualizarNaoVistos() {
      for (const pista of pistas) {
        if (pistaDisponivel(pista) && pistasConhecidas.indexOf(pista.id) === -1) {
          pistasConhecidas.push(pista.id);
          pistasNaoVistas.push(pista.id);
        }
      }
      for (const suspeito of suspeitos) {
        if (motivoVisivel(suspeito) && suspeitosConhecidos.indexOf(suspeito.nome) === -1) {
          suspeitosConhecidos.push(suspeito.nome);
          suspeitosNaoVistos.push(suspeito.nome);
        }
      }
    }

    function renderizarSuspeitos() {
      const listaSuspeitos = document.getElementById("lista-suspeitos");
      listaSuspeitos.innerHTML = "";

      for (const suspeito of suspeitos) {
        const item = document.createElement("li");

        const texto = document.createElement("span");
        let prefixo = "";
        if (suspeitosNaoVistos.indexOf(suspeito.nome) !== -1) {
          prefixo = "💡 ";
        }
        if (motivoVisivel(suspeito)) {
          texto.textContent = prefixo + suspeito.nome + " — " + suspeito.motivo + "  ";
        } else {
          texto.textContent = suspeito.nome + " — motivo ainda desconhecido  ";
        }
        item.appendChild(texto);

        const select = document.createElement("select");
        for (const opcao of opcoesStatus) {
          const option = document.createElement("option");
          option.value = opcao;
          option.textContent = opcao;
          select.appendChild(option);
        }
        select.value = suspeito.status;

        select.onchange = function () {
          suspeito.status = select.value;
          const i = suspeitosNaoVistos.indexOf(suspeito.nome);
          if (i !== -1) {
            suspeitosNaoVistos.splice(i, 1);
          }
          renderizarSuspeitos();
        };

        item.appendChild(select);
        listaSuspeitos.appendChild(item);
      }
    }

    function renderizarPistas(idRecemDescoberta) {
      const disponiveisDiv = document.getElementById("lista-disponiveis");
      disponiveisDiv.innerHTML = "";

      for (const pista of pistas) {
        if (pistaDisponivel(pista)) {
          const item = document.createElement("li");
          let prefixo = "";
          if (pistasNaoVistas.indexOf(pista.id) !== -1) {
            prefixo = "💡 ";
          }
          item.textContent = prefixo + "[" + pista.tipo + "] " + pista.nome + " ";

          const botao = document.createElement("button");
          botao.textContent = "Investigar";
          botao.onclick = function () {
            investigarPista(pista);
          };

          item.appendChild(botao);
          disponiveisDiv.appendChild(item);
        }
      }

      const descobertasDiv = document.getElementById("lista-descobertas");
      descobertasDiv.innerHTML = "";
      let contador = 0;

      for (const pista of pistas) {
        if (pista.descoberta) {
          contador = contador + 1;
          const item = document.createElement("li");
          let prefixo = "";
          if (pista.id === idRecemDescoberta) {
            prefixo = "💡 ";
          }
          let texto = prefixo + "[" + pista.tipo + "] " + pista.nome + " — " + pista.conteudo;
          if (pista.forca) {
            texto = texto + " (" + pista.forca + ")";
          }
          item.textContent = texto;
          descobertasDiv.appendChild(item);
        }
      }

      document.getElementById("contador").textContent = contador + " de " + pistas.length + " pistas descobertas";
    }

    function investigarPista(pista) {
      pista.descoberta = true;

      const idx = pistasNaoVistas.indexOf(pista.id);
      if (idx !== -1) {
        pistasNaoVistas.splice(idx, 1);
      }

      atualizarNaoVistos();

      renderizarPistas(pista.id);
      renderizarSuspeitos();
    }

    const selectAcusado = document.getElementById("select-acusado");
    for (const suspeito of suspeitos) {
      const opcao = document.createElement("option");
      opcao.value = suspeito.nome;
      opcao.textContent = suspeito.nome;
      selectAcusado.appendChild(opcao);
    }

    function acusar() {
      const nomeEscolhido = document.getElementById("select-acusado").value;
      let texto;

      if (nomeEscolhido === verdade.culpado) {
        texto = "FINAL B — PARCIAL: Você identificou Ricardo Meireles como o assassino de Henrique Lacerda. A motivação era pessoal — um caso extraconjugal e um desvio de dinheiro — não política. Mas o encobrimento feito pela Operação Falcão nunca foi provado.";
      } else if (nomeEscolhido === "Délcio Ramos") {
        texto = "FINAL D — ERRO: Você acusou Délcio Ramos, um estudante que apenas passou pelo apartamento para buscar panfletos. O verdadeiro assassino permanece livre.";
      } else {
        texto = "FINAL G — SEM SOLUÇÃO: as evidências reunidas não sustentam essa acusação. O caso permanece oficialmente sem solução.";
      }

      document.getElementById("resultado-final").textContent = texto;
      document.getElementById("tela-investigacao").style.display = "none";
      document.getElementById("tela-resultado").style.display = "block";
    }

    renderizarSuspeitos();
    renderizarPistas();
  </script>
</body>
</html>
