<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Arquivo do Caso</title>
</head>
<body>
  <h1>Caso 1968-01 — Operação Falcão</h1>

  <h2>Suspeitos</h2>
  <ul id="lista-suspeitos"></ul>

  <h2>Testemunhas</h2>
  <ul id="lista-testemunhas"></ul>

  <h2>Evidências</h2>
  <ul id="lista-evidencias"></ul>

  <script src="caso.js"></script>
  <script>
    const listaSuspeitos = document.getElementById("lista-suspeitos");
    for (const suspeito of suspeitos) {
      const item = document.createElement("li");
      item.textContent = suspeito.nome + " — " + suspeito.motivo;
      listaSuspeitos.appendChild(item);
    }

    const listaTestemunhas = document.getElementById("lista-testemunhas");
    for (const testemunha of testemunhas) {
      const item = document.createElement("li");
      item.textContent = testemunha.nome + " — " + testemunha.relato;
      listaTestemunhas.appendChild(item);
    }

    const listaEvidencias = document.getElementById("lista-evidencias");
    for (const evidencia of evidencias) {
      const item = document.createElement("li");
      item.textContent = "[" + evidencia.tipo + "] " + evidencia.descricao + " — " + evidencia.forca;
      listaEvidencias.appendChild(item);
    }
  </script>
</body>
</html>
