<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Arquivo do Caso</title>
</head>
<body>
  <h1>Caso 1968-01 — Operação Falcão</h1>

  <h2>Suspeitos</h2>
  <ul id="lista-suspeitos"></ul>

  <script src="caso.js"></script>
  <script>
    const lista = document.getElementById("lista-suspeitos");

    for (const suspeito of suspeitos) {
      const item = document.createElement("li");
      item.textContent = suspeito.nome + " — " + suspeito.motivo;
      lista.appendChild(item);
    }
  </script>
</body>
</html>
